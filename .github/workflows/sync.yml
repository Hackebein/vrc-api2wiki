name: sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrc-api2wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch DepotDownloader
        run: bash scripts/fetch-depotdownloader.sh

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test
        run: go test ./...

      - name: Restore VRChat session cache
        uses: actions/cache@v4
        with:
          path: .vrchat-session/cookies.jar
          key: vrchat-api2wiki-session-v1

      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: vrchat-api2wiki-images-v1-${{ github.run_id }}
          restore-keys: |
            vrchat-api2wiki-images-v1-

      - name: Run sync
        env:
          VRCWIKI_API_URL: ${{ secrets.VRCWIKI_API_URL }}
          VRCWIKI_USERNAME: ${{ secrets.VRCWIKI_USERNAME }}
          VRCWIKI_PASSWORD: ${{ secrets.VRCWIKI_PASSWORD }}
          VRCWIKI_AUTHORIZATION_HEADER: ${{ secrets.VRCWIKI_AUTHORIZATION_HEADER }}
          VRCWIKI_AUTHORIZATION_VALUE: ${{ secrets.VRCWIKI_AUTHORIZATION_VALUE }}
          VRCHAT_USERNAME: ${{ secrets.VRCHAT_USERNAME }}
          VRCHAT_PASSWORD: ${{ secrets.VRCHAT_PASSWORD }}
          VRCHAT_TOTP_SECRET: ${{ secrets.VRCHAT_TOTP_SECRET }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
          VRC_API2WIKI_IMAGE_CACHE: .image-cache
        run: go run ./cmd/vrc-api2wiki
